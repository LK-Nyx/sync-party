<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — {{ name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #eee; display: flex; min-height: 100vh; }
        .sidebar { width: 360px; background: #111; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .player-wrap { flex: 1; background: #000; position: relative; min-height: 400px; }
        #player { width: 100%; height: 100%; }
        .qr-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 10; }
        .qr-overlay.active { display: flex; }
        .qr-overlay img { max-width: 300px; border-radius: 12px; }
        h2 { font-size: 1.1rem; margin-bottom: 16px; }
        .section { margin-bottom: 18px; }
        .section label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 4px; }
        .section input, .section select { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #eee; font-size: 0.9rem; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; margin-bottom: 6px; font-weight: 600; }
        .btn-purple { background: #8338ec; color: white; }
        .btn-pink { background: #ff006e; color: white; }
        .btn-dark { background: #222; color: #ccc; border: 1px solid #333; }
        .btn-small { padding: 6px 10px; font-size: 0.75rem; width: auto; }
        .player-ctrls { display: flex; gap: 4px; }
        .player-ctrls button { flex: 1; }
        .mode-btns { display: flex; gap: 4px; }
        .mode-btns button { flex: 1; padding: 8px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #aaa; cursor: pointer; font-size: 0.75rem; }
        .mode-btns button.active { background: #8338ec; color: white; border-color: #8338ec; }
        .viewer-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #1a1a1a; border-radius: 6px; margin-bottom: 6px; font-size: 0.85rem; }
        .viewer-name { flex: 1; }
        .viewer-badges { display: flex; gap: 4px; margin: 0 8px; }
        .badge { padding: 2px 6px; border-radius: 10px; font-size: 0.65rem; font-weight: 600; }
        .badge-dj { background: #ff006e; color: white; }
        .badge-muted { background: #444; color: #999; }
        .badge-mode { background: #222; color: #aaa; }
        .badge-mod { background: #8338ec; color: white; }
        .viewer-actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .status { color: #4ade80; font-size: 0.8rem; margin-top: auto; }
        .status.disconnected { color: #f87171; }
        .source-btns { display: flex; gap: 4px; }
        .source-btns button { flex: 1; padding: 8px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #aaa; cursor: pointer; font-size: 0.75rem; }
        .source-btns button.active { background: #ff006e; color: white; border-color: #ff006e; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🎛️ Admin — {{ name }}</h2>

        <div class="section">
            <label>Source</label>
            <div class="source-btns" id="source-btns">
                <button data-prov="youtube" class="active" onclick="setProvider('youtube')">🎬 YouTube</button>
                <button data-prov="spotify" onclick="setProvider('spotify')">🎵 Spotify</button>
            </div>
        </div>

        <div class="section">
            <label>Playlist YouTube</label>
            <input type="text" id="playlist-url" value="{{ playlist_url }}" placeholder="URL ou ID playlist">
            <button class="btn btn-purple" style="margin-top:6px" onclick="setPlaylist()">Charger</button>
        </div>

        <div class="section">
            <label>Contrôles</label>
            <div class="player-ctrls">
                <button class="btn btn-dark" onclick="playerCmd('pause')">⏸</button>
                <button class="btn btn-dark" onclick="playerCmd('play')">▶</button>
                <button class="btn btn-dark" onclick="playerCmd('next')">⏭</button>
                <button class="btn btn-dark" onclick="playerCmd('prev')">⏮</button>
            </div>
        </div>

        <div class="section">
            <label>Mode global</label>
            <div class="mode-btns" id="mode-btns">
                <button data-mode="resume" class="active" onclick="setGlobalMode('resume')">📋</button>
                <button data-mode="video" onclick="setGlobalMode('video')">🎬</button>
                <button data-mode="audio" onclick="setGlobalMode('audio')">🎵</button>
                <button data-mode="karaoke" onclick="setGlobalMode('karaoke')">🎤</button>
            </div>
        </div>

        <div class="section">
            <button class="btn btn-purple" onclick="showQR()">📱 Afficher QR</button>
            <button class="btn btn-dark" onclick="hideQR()">❌ Cacher QR</button>
        </div>

        <div class="section">
            <label>Viewers (<span id="vc">0</span>)</label>
            <div id="viewer-list"></div>
        </div>

        <div class="status" id="status">🔴 Déconnecté</div>
    </div>

    <div class="main">
        <div class="player-wrap">
            <div id="player"></div>
            <div class="qr-overlay" id="qr-overlay">
                <img id="qr-img" src="" alt="QR Code">
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Jinja2 variables
        const SLUG = "{{ slug }}";
        const AUTH_TOKEN = "{{ auth_token }}";
    </script>
    <script>
    {% raw %}
        let player = null;
        let ws = null;
        let currentVideoId = '';
        let playerReady = false;
        let lastBroadcastTime = 0;

        // ── YouTube API ──────────────────────────────────────
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 0, controls: 1 },
                events: {
                    onReady: () => { playerReady = true; connectWS(); },
                    onStateChange: onStateChange,
                }
            });
        }

        function onStateChange(event) {
            if (!player || !playerReady) return;
            // throttle broadcasts
            const now = Date.now();
            if (now - lastBroadcastTime < 500) return;
            lastBroadcastTime = now;

            const vid = player.getVideoData()?.video_id || '';
            const title = player.getVideoData()?.title || '';
            const time = player.getCurrentTime();

            send({ type: 'player_update', video_id: vid, title: title, state: event.data, current_time: time });
        }

        // ── WebSocket ────────────────────────────────────────
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(proto + '//' + location.host + '/ws/' + SLUG);
            ws.onopen = () => {
                setStatus('🟢 Connecté');
                // Auth as first message
                ws.send(JSON.stringify({ role: 'admin', token: AUTH_TOKEN }));
            };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'auth_ok') renderViewers(msg.viewers);
                if (msg.type === 'viewer_list') renderViewers(msg.viewers);
                if (msg.type === 'dj_request') onDJRequest(msg);
                if (msg.type === 'viewer_count') updateCount(msg.count);
            };
            ws.onclose = () => {
                setStatus('🔴 Déconnecté — reconnexion...');
                setTimeout(connectWS, 3000);
            };
        }

        function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

        function setStatus(txt) {
            const el = document.getElementById('status');
            el.textContent = txt;
            el.className = 'status' + (txt.includes('🔴') ? ' disconnected' : '');
        }

        // ── Controls ─────────────────────────────────────────
        function playerCmd(cmd) {
            if (!player) return;
            if (cmd === 'play') player.playVideo();
            if (cmd === 'pause') player.pauseVideo();
            if (cmd === 'next') player.nextVideo();
            if (cmd === 'prev') player.previousVideo();
        }

        function setPlaylist() {
            const url = document.getElementById('playlist-url').value.trim();
            if (!url) return;
            const m = url.match(/[&?]list=([a-zA-Z0-9_-]+)/);
            const playlistId = m ? m[1] : url;
            if (player) {
                player.loadPlaylist({ list: playlistId, listType: 'playlist' });
                currentVideoId = '';
            }
            send({ type: 'set_playlist', url: url, video_id: '' });
        }

        function setGlobalMode(mode) {
            document.querySelectorAll('#mode-btns button').forEach(b => b.classList.remove('active'));
            document.querySelector('#mode-btns button[data-mode="' + mode + '"]').classList.add('active');
            send({ type: 'set_mode', mode });
        }

        function setProvider(prov) {
            document.querySelectorAll('#source-btns button').forEach(b => b.classList.remove('active'));
            document.querySelector('#source-btns button[data-prov="' + prov + '"]').classList.add('active');
            send({ type: 'set_provider', provider: prov });
        }

        function muteViewer(n) { send({ type: 'mute_viewer', target: n }); }
        function unmuteViewer(n) { send({ type: 'unmute_viewer', target: n }); }
        function kickViewer(n) { send({ type: 'kick_viewer', target: n }); }
        function promoteDJ(n) { send({ type: 'promote_dj', target: n }); }

        function showQR() {
            document.getElementById('qr-img').src = '/party/' + SLUG + '/qr';
            document.getElementById('qr-overlay').classList.add('active');
            send({ type: 'show_qr' });
        }
        function hideQR() {
            document.getElementById('qr-overlay').classList.remove('active');
            send({ type: 'hide_qr' });
        }

        function onDJRequest(msg) {
            if (msg.command === 'next') player.nextVideo();
            if (msg.command === 'prev') player.previousVideo();
        }

        // ── Viewer list ──────────────────────────────────────
        function renderViewers(viewers) {
            updateCount(viewers.length);
            const c = document.getElementById('viewer-list');
            c.innerHTML = viewers.map(v => `
                <div class="viewer-item">
                    <span class="viewer-name">${v.name}</span>
                    <span class="viewer-badges">
                        ${v.role === 'moderator' ? '<span class="badge badge-mod">MOD</span>' : ''}
                        ${v.is_dj ? '<span class="badge badge-dj">DJ</span>' : ''}
                        ${v.muted ? '<span class="badge badge-muted">MUTE</span>' : ''}
                        <span class="badge badge-mode">${v.mode}</span>
                    </span>
                    <span class="viewer-actions">
                        ${v.muted
                            ? '<button class="btn btn-small btn-dark" onclick="unmuteViewer(\'' + v.name + '\')">🔊</button>'
                            : '<button class="btn btn-small btn-dark" onclick="muteViewer(\'' + v.name + '\')">🔇</button>'}
                        <button class="btn btn-small btn-dark" onclick="kickViewer(\'' + v.name + '\')">✕</button>
                        ${!v.is_dj
                            ? '<button class="btn btn-small btn-pink" onclick="promoteDJ(\'' + v.name + '\')">⭐</button>'
                            : '<button class="btn btn-small btn-dark" onclick="promoteDJ(\'\')" title="Retirer DJ">👑</button>'}
                    </span>
                </div>
            `).join('');
        }

        function updateCount(n) { document.getElementById('vc').textContent = n; }
    {% endraw %}
    </script>
</body>
</html>
