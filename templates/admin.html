<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — {{ name }}</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111;
            --surface2: #1a1a1a;
            --text: #eee;
            --text-dim: #aaa;
            --text-muted: #888;
            --border: #222;
            --border2: #333;
            --accent: #8338ec;
            --pink: #ff006e;
            --danger: #f87171;
            --success: #4ade80;
        }
        :root.light {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --surface2: #f0f0f0;
            --text: #1a1a1a;
            --text-dim: #555;
            --text-muted: #777;
            --border: #e0e0e0;
            --border2: #ccc;
            --accent: #8338ec;
            --pink: #ff006e;
            --danger: #dc2626;
            --success: #16a34a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        .sidebar { width: 360px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .player-wrap { flex: 1; background: #000; position: relative; min-height: 400px; }
        #player { width: 100%; height: 100%; }
        /* Share cards */
        .share-cards { display: flex; flex-direction: column; gap: 8px; }
        .share-card { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; }
        .share-card-qr { width: 56px; height: 56px; border-radius: 6px; flex-shrink: 0; cursor: pointer; transition: transform 0.2s; }
        .share-card-qr:hover { transform: scale(1.08); }
        .share-card-body { flex: 1; min-width: 0; }
        .share-card-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
        .share-card-url { font-size: 0.75rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .share-card-copy { width: 30px; height: 30px; border: 1px solid var(--border2); border-radius: 50%; background: var(--surface2); color: var(--text); cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
        .share-card-copy:hover { border-color: var(--accent); background: var(--accent); color: white; }
        .share-card-copy.copied { background: var(--success); border-color: var(--success); color: white; }
        h2 { font-size: 1.1rem; margin-bottom: 16px; }
        .section { margin-bottom: 18px; }
        .section label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .section input, .section select { width: 100%; padding: 10px; border: 1px solid var(--border2); border-radius: 6px; background: var(--surface2); color: var(--text); font-size: 0.9rem; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; margin-bottom: 6px; font-weight: 600; }
        .btn-purple { background: var(--accent); color: white; }
        .btn-pink { background: var(--pink); color: white; }
        .btn-dark { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border2); }
        .btn-small { padding: 6px 10px; font-size: 0.75rem; width: auto; }
        .player-ctrls { display: flex; gap: 4px; }
        .player-ctrls button { flex: 1; }

        /* Mode pill dropdown */
        .mode-pill-wrapper { position: relative; }
        .mode-pill-btn {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border2); border-radius: 20px;
            background: var(--surface2); color: var(--text); cursor: pointer; font-size: 0.85rem; font-weight: 600;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            transition: border-color 0.2s;
        }
        .mode-pill-btn:hover { border-color: var(--accent); }
        .mode-pill-btn .arrow { font-size: 0.6rem; transition: transform 0.2s; }
        .mode-pill-btn.open .arrow { transform: rotate(180deg); }
        .mode-dropdown {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
            background: var(--surface); border: 1px solid var(--border2); border-radius: 12px;
            overflow: hidden; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .mode-dropdown.open { display: block; }
        .mode-dropdown button {
            width: 100%; padding: 10px 14px; border: none; background: transparent; color: var(--text);
            cursor: pointer; font-size: 0.85rem; text-align: left; display: flex; align-items: center; gap: 8px;
        }
        .mode-dropdown button:hover { background: var(--surface2); }
        .mode-dropdown button.active { background: var(--accent); color: white; }

        .viewer-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--surface2); border-radius: 6px; margin-bottom: 6px; font-size: 0.85rem; }
        .viewer-name { flex: 1; }
        .viewer-badges { display: flex; gap: 4px; margin: 0 8px; }
        .badge { padding: 2px 6px; border-radius: 10px; font-size: 0.65rem; font-weight: 600; }
        .badge-dj { background: var(--pink); color: white; }
        .badge-muted { background: #444; color: #999; }
        .badge-mode { background: #222; color: #aaa; }
        .badge-mod { background: var(--accent); color: white; }
        .viewer-actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .status { color: var(--success); font-size: 0.8rem; margin-top: auto; }
        .status.disconnected { color: var(--danger); }
        .source-btns { display: flex; gap: 4px; }
        .source-btns button { flex: 1; padding: 8px; border: 1px solid var(--border2); border-radius: 6px; background: var(--surface2); color: var(--text-dim); cursor: pointer; font-size: 0.75rem; }
        .source-btns button.active { background: var(--pink); color: white; border-color: var(--pink); }

        /* Top bar items */
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .sidebar-header h2 { margin-bottom: 0; }
        .header-actions { display: flex; gap: 6px; }
        .icon-btn {
            width: 34px; height: 34px; border: 1px solid var(--border2); border-radius: 50%;
            background: var(--surface2); color: var(--text); cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .icon-btn:hover { border-color: var(--accent); background: var(--accent); color: white; }
        .icon-btn.copied { background: var(--success); border-color: var(--success); color: white; }

        /* ── Simple / Advanced Mode ─────────────────── */
        .simple-only { display: none; }
        .advanced-only { }
        .mode-toggle-btn {
            width: 34px; height: 34px; border: 1px solid var(--border2); border-radius: 8px;
            background: var(--surface2); color: var(--text); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.75rem; transition: all 0.2s; flex-shrink: 0;
        }
        .mode-toggle-btn:hover { border-color: var(--accent); background: var(--accent); color: white; }

        body.simple-mode { font-size: 1.15rem; }
        body.simple-mode .sidebar { padding: 26px 24px; }
        body.simple-mode .section { margin-bottom: 24px; }
        body.simple-mode .section label { font-size: 1rem; margin-bottom: 6px; }
        body.simple-mode .section input, body.simple-mode .section select { font-size: 1.05rem; padding: 14px; }
        body.simple-mode .btn { padding: 14px; font-size: 1.05rem; border-radius: 10px; }
        body.simple-mode .btn-small { padding: 10px 16px; font-size: 0.9rem; }
        body.simple-mode .source-btns button { padding: 14px; font-size: 0.95rem; }
        body.simple-mode h2 { font-size: 1.35rem; }
        body.simple-mode .mode-pill-btn { padding: 14px 20px; font-size: 1rem; }
        body.simple-mode .mode-dropdown button { padding: 14px; font-size: 1rem; }
        body.simple-mode .icon-btn { width: 42px; height: 42px; font-size: 1.2rem; }
        body.simple-mode .mode-toggle-btn { width: 42px; height: 42px; font-size: 0.9rem; }
        body.simple-mode .viewer-item { padding: 10px 12px; font-size: 1rem; }
        body.simple-mode .player-ctrls button { padding: 14px; font-size: 1.1rem; }
        body.simple-mode .share-card { padding: 14px; }
        body.simple-mode .share-card-url { font-size: 0.9rem; }
        body.simple-mode .share-card-title { font-size: 0.85rem; }
        body.simple-mode .share-card-copy { width: 38px; height: 38px; font-size: 1rem; }
        body.simple-mode .advanced-only { display: none !important; }
        body.simple-mode .simple-only { display: block; }
        /* Simple mode: simplified player controls (just play/pause) */
        body.simple-mode .player-ctrls.advanced-only { display: none !important; }

    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🎛️ Admin — {{ name }}</h2>
            <div class="header-actions">
                <button class="mode-toggle-btn" onclick="toggleSimpleMode()" title="Basculer mode simple / avancé" id="mode-toggle-btn">Aa</button>
                <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Thème">🌙</button>
            </div>
        </div>

        <div class="section">
            <label>Source</label>
            <div class="source-btns" id="source-btns">
                <button data-prov="youtube" class="active" onclick="setProvider('youtube')">🎬 YouTube</button>
                <button data-prov="spotify" onclick="setProvider('spotify')">🎵 Spotify</button>
            </div>
        </div>

        <div class="section advanced-only">
            <label>Playlist YouTube</label>
            <input type="text" id="playlist-url" value="{{ playlist_url }}" placeholder="URL ou ID playlist">
            <button class="btn btn-purple" style="margin-top:6px" onclick="setPlaylist()">Charger</button>
        </div>

        <div class="section">
            <label>Contrôles</label>
            <!-- Simple mode: just Play/Pause -->
            <div class="player-ctrls simple-only" id="simple-ctrls">
                <button class="btn btn-dark" onclick="playerCmd('play')" style="font-size:1.2rem">▶ Lecture</button>
                <button class="btn btn-dark" onclick="playerCmd('pause')" style="font-size:1.2rem">⏸ Pause</button>
            </div>
            <!-- Advanced mode: full controls -->
            <div class="player-ctrls advanced-only" id="adv-ctrls">
                <button class="btn btn-dark" onclick="playerCmd('pause')">⏸</button>
                <button class="btn btn-dark" onclick="playerCmd('play')">▶</button>
                <button class="btn btn-dark" onclick="playerCmd('next')">⏭</button>
                <button class="btn btn-dark" onclick="playerCmd('prev')">⏮</button>
            </div>
        </div>

        <div class="section">
            <label>Mode global</label>
            <div class="mode-pill-wrapper" id="mode-pill-wrapper">
                <button class="mode-pill-btn" onclick="toggleModeDropdown()" id="mode-pill-btn">
                    <span id="mode-pill-label">📋 Résumé</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="mode-dropdown" id="mode-dropdown">
                    <button data-mode="resume" class="active" onclick="setGlobalMode('resume')">📋 Résumé</button>
                    <button data-mode="video" onclick="setGlobalMode('video')">🎬 Vidéo</button>
                    <button data-mode="audio" onclick="setGlobalMode('audio')">🎵 Audio</button>
                    <button data-mode="karaoke" onclick="setGlobalMode('karaoke')">🎤 Karaoké</button>
                </div>
            </div>
        </div>

        <div class="section">
            <label>Partager</label>
            <div class="share-cards">
                <div class="share-card" id="share-room">
                    <img class="share-card-qr" id="room-qr" src="/party/{{ slug }}/qr?type=room" alt="QR Room" onclick="copyCardUrl('room')">
                    <div class="share-card-body" onclick="copyCardUrl('room')">
                        <div class="share-card-title">🏠 Room — inviter</div>
                        <div class="share-card-url" id="room-url"></div>
                    </div>
                    <button class="share-card-copy" id="room-copy-btn" onclick="copyCardUrl('room')" title="Copier le lien">📋</button>
                </div>
                <div class="share-card" id="share-source">
                    <img class="share-card-qr" id="source-qr" src="/party/{{ slug }}/qr" alt="QR Source" onclick="copyCardUrl('source')">
                    <div class="share-card-body" onclick="copyCardUrl('source')">
                        <div class="share-card-title">🎬 Source — playlist</div>
                        <div class="share-card-url" id="source-url"></div>
                    </div>
                    <button class="share-card-copy" id="source-copy-btn" onclick="copyCardUrl('source')" title="Copier le lien">📋</button>
                </div>
            </div>
        </div>

        <div class="section advanced-only">
            <label>Viewers (<span id="vc">0</span>)</label>
            <div id="viewer-list"></div>
        </div>

        <div class="status" id="status">🔴 Déconnecté</div>
    </div>

    <div class="main">
        <div class="player-wrap">
            <div id="player"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Jinja2 variables
        const SLUG = "{{ slug }}";
        const AUTH_TOKEN = "{{ auth_token }}";
    </script>
    <script>
    {% raw %}
        let player = null;
        let ws = null;
        let currentVideoId = '';
        let playerReady = false;
        let lastBroadcastTime = 0;

        // ── Theme ──────────────────────────────────────────
        function toggleTheme() {
            const root = document.documentElement;
            const isLight = root.classList.toggle('light');
            const btn = document.querySelector('.theme-toggle');
            btn.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        (function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') {
                document.documentElement.classList.add('light');
                document.querySelector('.theme-toggle').textContent = '☀️';
            }
        })();

        // ── Simple / Advanced Mode Toggle ──────────────────
        function toggleSimpleMode() {
            const isSimple = document.body.classList.toggle('simple-mode');
            localStorage.setItem('uimode', isSimple ? 'simple' : 'advanced');
            const btn = document.getElementById('mode-toggle-btn');
            btn.textContent = isSimple ? '⚙️' : 'Aa';
        }
        (function initUIMode() {
            const saved = localStorage.getItem('uimode');
            // Default is simple mode
            if (saved === 'advanced') {
                // Stay in advanced (default) — no class added
            } else {
                document.body.classList.add('simple-mode');
                const btn = document.getElementById('mode-toggle-btn');
                if (btn) btn.textContent = '⚙️';
            }
        })();

        // ── Share cards ──────────────────────────────────────
        const ROOM_URL = window.location.origin + '/party/' + SLUG;
        let playlistUrl = '{{ playlist_url }}';

        function setCardUrls() {
            document.getElementById('room-url').textContent = ROOM_URL;
            const srcEl = document.getElementById('source-url');
            srcEl.textContent = playlistUrl || ROOM_URL;
        }
        setCardUrls();

        function copyCardUrl(type) {
            const url = type === 'room' ? ROOM_URL : (playlistUrl || ROOM_URL);
            const btnId = type + '-copy-btn';
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.getElementById(btnId);
                const orig = btn.textContent;
                btn.textContent = '✓';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
            });
        }

        function refreshSourceQR() {
            document.getElementById('source-qr').src = '/party/' + SLUG + '/qr?t=' + Date.now();
        }

        // ── Mode dropdown ───────────────────────────────────
        function toggleModeDropdown() {
            const dd = document.getElementById('mode-dropdown');
            const btn = document.getElementById('mode-pill-btn');
            dd.classList.toggle('open');
            btn.classList.toggle('open');
        }
        document.addEventListener('click', (e) => {
            const wrapper = document.getElementById('mode-pill-wrapper');
            if (!wrapper.contains(e.target)) {
                document.getElementById('mode-dropdown').classList.remove('open');
                document.getElementById('mode-pill-btn').classList.remove('open');
            }
        });

        // ── YouTube API ──────────────────────────────────────
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 0, controls: 1 },
                events: {
                    onReady: () => { playerReady = true; connectWS(); },
                    onStateChange: onStateChange,
                }
            });
        }

        function onStateChange(event) {
            if (!player || !playerReady) return;
            // throttle broadcasts
            const now = Date.now();
            if (now - lastBroadcastTime < 500) return;
            lastBroadcastTime = now;

            const vid = player.getVideoData()?.video_id || '';
            const title = player.getVideoData()?.title || '';
            const time = player.getCurrentTime();

            send({ type: 'player_update', video_id: vid, title: title, state: event.data, current_time: time });
        }

        // ── Timecode polling ────────────────────────
        // Broadcast current timecode every 2s even without state change
        // This keeps all viewers in sync even during continuous playback
        setInterval(() => {
            if (!player || !playerReady) return;
            if (player.getPlayerState() !== 1) return; // only when playing
            const vid = player.getVideoData()?.video_id || '';
            const title = player.getVideoData()?.title || '';
            const time = player.getCurrentTime();
            if (vid) {
                send({ type: 'player_update', video_id: vid, title: title, state: 1, current_time: time });
            }
        }, 2000);

        // ── WebSocket ────────────────────────────────────────
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(proto + '//' + location.host + '/ws/' + SLUG);
            ws.onopen = () => {
                setStatus('🟢 Connecté');
                // Auth as first message
                ws.send(JSON.stringify({ role: 'admin', token: AUTH_TOKEN }));
            };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'auth_ok') renderViewers(msg.viewers);
                if (msg.type === 'viewer_list') renderViewers(msg.viewers);
                if (msg.type === 'dj_request') onDJRequest(msg);
                if (msg.type === 'viewer_count') updateCount(msg.count);
            };
            ws.onclose = () => {
                setStatus('🔴 Déconnecté — reconnexion...');
                setTimeout(connectWS, 3000);
            };
        }

        function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

        function setStatus(txt) {
            const el = document.getElementById('status');
            el.textContent = txt;
            el.className = 'status' + (txt.includes('🔴') ? ' disconnected' : '');
        }

        // ── Controls ─────────────────────────────────────────
        function playerCmd(cmd) {
            if (!player) return;
            if (cmd === 'play') player.playVideo();
            if (cmd === 'pause') player.pauseVideo();
            if (cmd === 'next') player.nextVideo();
            if (cmd === 'prev') player.previousVideo();
        }

        function setPlaylist() {
            const url = document.getElementById('playlist-url').value.trim();
            if (!url) return;
            const m = url.match(/[&?]list=([a-zA-Z0-9_-]+)/);
            const playlistId = m ? m[1] : url;
            if (player) {
                player.loadPlaylist({ list: playlistId, listType: 'playlist' });
                currentVideoId = '';
            }
            playlistUrl = url;
            setCardUrls();
            refreshSourceQR();
            send({ type: 'set_playlist', url: url, video_id: '' });
        }

        const MODE_LABELS = { resume: '📋 Résumé', video: '🎬 Vidéo', audio: '🎵 Audio', karaoke: '🎤 Karaoké' };

        function setGlobalMode(mode) {
            document.querySelectorAll('#mode-dropdown button').forEach(b => b.classList.remove('active'));
            const activeBtn = document.querySelector('#mode-dropdown button[data-mode="' + mode + '"]');
            if (activeBtn) activeBtn.classList.add('active');
            document.getElementById('mode-pill-label').textContent = MODE_LABELS[mode] || mode;
            // Close dropdown
            document.getElementById('mode-dropdown').classList.remove('open');
            document.getElementById('mode-pill-btn').classList.remove('open');
            send({ type: 'set_mode', mode });
        }

        function setProvider(prov) {
            document.querySelectorAll('#source-btns button').forEach(b => b.classList.remove('active'));
            document.querySelector('#source-btns button[data-prov="' + prov + '"]').classList.add('active');
            send({ type: 'set_provider', provider: prov });
        }

        function muteViewer(n) { send({ type: 'mute_viewer', target: n }); }
        function unmuteViewer(n) { send({ type: 'unmute_viewer', target: n }); }
        function kickViewer(n) { send({ type: 'kick_viewer', target: n }); }
        function promoteDJ(n) { send({ type: 'promote_dj', target: n }); }

        function onDJRequest(msg) {
            if (msg.command === 'next') player.nextVideo();
            if (msg.command === 'prev') player.previousVideo();
        }

        // ── Viewer list ──────────────────────────────────────
        function renderViewers(viewers) {
            updateCount(viewers.length);
            const c = document.getElementById('viewer-list');
            c.innerHTML = viewers.map(v => `
                <div class="viewer-item">
                    <span class="viewer-name">${v.name}</span>
                    <span class="viewer-badges">
                        ${v.role === 'moderator' ? '<span class="badge badge-mod">MOD</span>' : ''}
                        ${v.is_dj ? '<span class="badge badge-dj">DJ</span>' : ''}
                        ${v.muted ? '<span class="badge badge-muted">MUTE</span>' : ''}
                        <span class="badge badge-mode">${v.mode}</span>
                    </span>
                    <span class="viewer-actions">
                        ${v.muted
                            ? '<button class="btn btn-small btn-dark" onclick="unmuteViewer(\'' + v.name + '\')">🔊</button>'
                            : '<button class="btn btn-small btn-dark" onclick="muteViewer(\'' + v.name + '\')">🔇</button>'}
                        <button class="btn btn-small btn-dark" onclick="kickViewer(\'' + v.name + '\')">✕</button>
                        ${!v.is_dj
                            ? '<button class="btn btn-small btn-pink" onclick="promoteDJ(\'' + v.name + '\')">⭐</button>'
                            : '<button class="btn btn-small btn-dark" onclick="promoteDJ(\'\')" title="Retirer DJ">👑</button>'}
                    </span>
                </div>
            `).join('');
        }

        function updateCount(n) { document.getElementById('vc').textContent = n; }
    {% endraw %}
    </script>
</body>
</html>
