<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — {{ name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #eee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 400px;
            width: 90%;
            padding: 30px;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
        }
        h2 { margin-bottom: 20px; font-size: 1.3rem; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #111;
            color: #eee;
            font-size: 1rem;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #8338ec;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Admin — {{ name }}</h2>
        <form method="get" action="/party/{{ slug }}/admin">
            <input type="password" name="pwd" placeholder="Mot de passe" required autofocus>
            <button type="submit">Entrer</button>
        </form>
    </div>
</body>
</html>
