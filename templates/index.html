<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Party</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #eee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 480px;
            width: 90%;
            padding: 40px 30px;
            background: #1a1a1a;
            border-radius: 16px;
            border: 1px solid #333;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #888; margin-bottom: 30px; font-size: 0.95rem; }
        label { display: block; margin: 16px 0 6px; color: #aaa; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #111;
            color: #eee;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #8338ec; }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .mode-badges { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
        .badge {
            background: #222;
            color: #aaa;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sync Party</h1>
        <p class="subtitle">Watch party YouTube synchronisée. Crée ta room, partage le lien.</p>
        
        <form action="/create" method="post">
            <label for="name">Nom de la room</label>
            <input type="text" id="name" name="name" placeholder="Soirée 80s" required>
            
            <label for="admin_password">Mot de passe admin</label>
            <input type="password" id="admin_password" name="admin_password" placeholder="Choisis un mot de passe" required>
            
            <button type="submit">Créer la room</button>
        </form>
        
        <div class="mode-badges">
            <span class="badge">🎬 Vidéo</span>
            <span class="badge">🎵 Audio only</span>
            <span class="badge">🎤 Karaoké</span>
            <span class="badge">📋 Résumé</span>
            <span class="badge">📱 QR Code</span>
        </div>
    </div>
</body>
</html>
