<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch — {{ name }}</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111;
            --surface2: #1a1a1a;
            --text: #eee;
            --text-dim: #aaa;
            --text-muted: #888;
            --border: #222;
            --border2: #333;
            --accent: #8338ec;
            --pink: #ff006e;
        }
        :root.light {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --surface2: #f0f0f0;
            --text: #1a1a1a;
            --text-dim: #555;
            --text-muted: #777;
            --border: #e0e0e0;
            --border2: #ccc;
            --accent: #8338ec;
            --pink: #ff006e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 8px; }
        .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .topbar-left h2 { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

        /* Icon buttons (copy, theme) */
        .icon-btn {
            width: 34px; height: 34px; border: 1px solid var(--border2); border-radius: 50%;
            background: var(--surface2); color: var(--text); cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
        }
        .icon-btn:hover { border-color: var(--accent); background: var(--accent); color: white; }
        .icon-btn.copied { background: #4ade80; border-color: #4ade80; color: white; }

        /* Mode pill dropdown */
        .mode-pill-wrapper { position: relative; }
        .mode-pill-btn {
            padding: 7px 14px; border: 1px solid var(--border2); border-radius: 20px;
            background: var(--surface2); color: var(--text); cursor: pointer; font-size: 0.8rem; font-weight: 600;
            display: flex; align-items: center; gap: 6px; transition: border-color 0.2s; white-space: nowrap;
        }
        .mode-pill-btn:hover { border-color: var(--accent); }
        .mode-pill-btn .arrow { font-size: 0.55rem; transition: transform 0.2s; }
        .mode-pill-btn.open .arrow { transform: rotate(180deg); }
        .mode-dropdown {
            position: absolute; top: calc(100% + 4px); right: 0; z-index: 50;
            background: var(--surface); border: 1px solid var(--border2); border-radius: 12px;
            overflow: hidden; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.3); min-width: 160px;
        }
        .mode-dropdown.open { display: block; }
        .mode-dropdown button {
            width: 100%; padding: 10px 14px; border: none; background: transparent; color: var(--text);
            cursor: pointer; font-size: 0.85rem; text-align: left; display: flex; align-items: center; gap: 8px;
        }
        .mode-dropdown button:hover { background: var(--surface2); }
        .mode-dropdown button.active { background: var(--accent); color: white; }

        .content { flex: 1; position: relative; overflow: hidden; }
        .view { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; }
        .view.active { display: flex; }
        #view-video { background: #000; }
        #view-video #player { width: 100%; height: 100%; }
        #view-audio { background: var(--bg); align-items: center; justify-content: center; flex-direction: column; }
        .audio-viz { width: 200px; height: 200px; border-radius: 50%; background: linear-gradient(135deg, #ff006e, #8338ec); animation: pulse 2s ease-in-out infinite; margin-bottom: 20px; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
        .audio-title { font-size: 1.2rem; text-align: center; max-width: 300px; }
        #view-resume { background: var(--bg); flex-direction: column; padding: 20px; overflow-y: auto; }
        .resume-section { margin-bottom: 20px; padding: 16px; background: var(--surface2); border-radius: 8px; border: 1px solid var(--border); }
        .resume-section h3 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
        .resume-now p { font-size: 1.1rem; word-break: break-word; }
        #view-karaoke { background: #000; }
        #view-karaoke iframe { width: 100%; height: 100%; border: none; }
        .qr-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 100; flex-direction: column; }
        .qr-overlay.active { display: flex; }
        .qr-overlay img { max-width: 280px; border-radius: 12px; margin-bottom: 16px; }
        .qr-overlay .qr-link { font-size: 0.8rem; color: #888; max-width: 280px; word-break: break-all; text-align: center; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-left">
            <h2>🎬 {{ name }}</h2>
            <button class="icon-btn" id="copy-link-btn" onclick="copyLink()" title="Copier le lien">🔗</button>
        </div>
        <div class="topbar-right">
            <div class="mode-pill-wrapper" id="mode-pill-wrapper">
                <button class="mode-pill-btn" onclick="toggleModeDropdown()" id="mode-pill-btn">
                    <span id="mode-pill-label">📋 Résumé</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="mode-dropdown" id="mode-dropdown">
                    <button data-mode="resume" class="active" onclick="switchMode('resume')">📋 Résumé</button>
                    <button data-mode="video" onclick="switchMode('video')">🎬 Vidéo</button>
                    <button data-mode="audio" onclick="switchMode('audio')">🎵 Audio</button>
                    <button data-mode="karaoke" onclick="switchMode('karaoke')">🎤 Karaoké</button>
                </div>
            </div>
            <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Thème">🌙</button>
            <span id="vc" style="font-size:0.8rem;color:var(--text-muted)">0 👥</span>
        </div>
    </div>

    <div class="content">
        <div class="view active" id="view-resume">
            <div class="resume-section resume-now">
                <h3>📋 EN COURS</h3>
                <p id="resume-title">En attente...</p>
            </div>
            <div class="resume-section">
                <h3>🔗 PLAYLIST</h3>
                <a id="resume-link" href="#" target="_blank" style="color:var(--accent)">Ouvrir sur YouTube</a>
            </div>
            <div class="resume-section">
                <h3>👥 CONNECTÉS</h3>
                <span id="resume-count">0</span> viewers
            </div>
        </div>
        <div class="view" id="view-video">
            <div id="player"></div>
        </div>
        <div class="view" id="view-audio">
            <div class="audio-viz"></div>
            <p class="audio-title" id="audio-title">En attente...</p>
        </div>
        <div class="view" id="view-karaoke">
            <iframe id="karaoke-frame" src="" allow="autoplay"></iframe>
        </div>
    </div>

    <div class="qr-overlay" id="qr-overlay">
        <img id="qr-img" src="" alt="QR Code">
        <p class="qr-link" id="qr-link"></p>
    </div>

    <script>
        // Jinja2 variables
        const SLUG = "{{ slug }}";
    </script>
    <script>
    {% raw %}
        let ws = null;
        let currentMode = 'resume';
        let forcedMode = null;
        let player = null;
        let currentVideoId = '';
        let syncTargetTime = 0;
        let viewerCount = 0;

        // ── Theme ──────────────────────────────────────────
        function toggleTheme() {
            const root = document.documentElement;
            const isLight = root.classList.toggle('light');
            const btn = document.querySelector('.theme-toggle');
            btn.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        (function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') {
                document.documentElement.classList.add('light');
                document.querySelector('.theme-toggle').textContent = '☀️';
            }
        })();

        // ── Copy link ──────────────────────────────────────
        function copyLink() {
            const url = window.location.origin + '/party/' + SLUG;
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.getElementById('copy-link-btn');
                const orig = btn.textContent;
                btn.textContent = '✓';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
            });
        }

        // ── Mode dropdown ───────────────────────────────────
        function toggleModeDropdown() {
            const dd = document.getElementById('mode-dropdown');
            const btn = document.getElementById('mode-pill-btn');
            dd.classList.toggle('open');
            btn.classList.toggle('open');
        }
        document.addEventListener('click', (e) => {
            const wrapper = document.getElementById('mode-pill-wrapper');
            if (!wrapper.contains(e.target)) {
                document.getElementById('mode-dropdown').classList.remove('open');
                document.getElementById('mode-pill-btn').classList.remove('open');
            }
        });

        // ── Cold-start: get initial state ────────────────────
        async function loadInitialState() {
            try {
                const resp = await fetch('/api/room/' + SLUG + '/state');
                const state = await resp.json();
                viewerCount = state.viewer_count || 0;
                updateCount();
                document.getElementById('resume-title').textContent = state.video_title || 'En attente...';
                if (state.playlist_url) {
                    document.getElementById('resume-link').href = state.playlist_url;
                }
                if (state.global_mode) {
                    forcedMode = state.global_mode;
                    switchMode(state.global_mode);
                }
            } catch(e) { console.log('Cold-start fetch failed:', e); }
        }

        // ── WebSocket ────────────────────────────────────────
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(proto + '//' + location.host + '/ws/' + SLUG);
            ws.onopen = () => {
                ws.send(JSON.stringify({ role: 'viewer' }));
            };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                handle(msg);
            };
            ws.onclose = () => { setTimeout(connectWS, 3000); };
        }
        function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

        function handle(msg) {
            switch (msg.type) {
                case 'player_state':
                    if (msg.video_title) {
                        document.getElementById('resume-title').textContent = msg.video_title;
                        document.getElementById('audio-title').textContent = msg.video_title;
                    }
                    if (msg.playlist_url) {
                        document.getElementById('resume-link').href = msg.playlist_url;
                    }
                    if (msg.viewer_count !== undefined) {
                        viewerCount = msg.viewer_count;
                        updateCount();
                    }
                    if (currentMode === 'video') syncPlayer(msg);
                    if (currentMode === 'karaoke') syncKaraoke(msg);
                    break;

                case 'playlist_set':
                    document.getElementById('resume-link').href = msg.url;
                    break;

                case 'mode_changed':
                    if (!forcedMode) switchMode(msg.mode);
                    break;

                case 'mode_forced':
                    forcedMode = msg.mode;
                    switchMode(msg.mode);
                    break;

                case 'show_qr':
                    document.getElementById('qr-img').src = '/party/' + SLUG + '/qr';
                    document.getElementById('qr-link').textContent = msg.url;
                    document.getElementById('qr-overlay').classList.add('active');
                    break;

                case 'hide_qr':
                    document.getElementById('qr-overlay').classList.remove('active');
                    break;

                case 'viewer_joined':
                    viewerCount = msg.count;
                    updateCount();
                    break;

                case 'viewer_left':
                    viewerCount = msg.count;
                    updateCount();
                    break;

                case 'muted': forcedMode = 'resume'; switchMode('resume'); break;
                case 'unmuted': forcedMode = null; break;

                case 'kicked':
                    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#f87171;font-size:1.5rem">🚫 Déconnecté par l\'admin</div>';
                    break;
            }
        }

        function updateCount() {
            document.getElementById('vc').textContent = viewerCount + ' 👥';
            document.getElementById('resume-count').textContent = viewerCount;
        }

        // ── Modes ─────────────────────────────────────────────
        const MODE_LABELS = { resume: '📋 Résumé', video: '🎬 Vidéo', audio: '🎵 Audio', karaoke: '🎤 Karaoké' };

        function switchMode(mode) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelector('#view-' + mode).classList.add('active');
            // Update dropdown
            document.querySelectorAll('#mode-dropdown button').forEach(b => b.classList.remove('active'));
            const activeBtn = document.querySelector('#mode-dropdown button[data-mode="' + mode + '"]');
            if (activeBtn) activeBtn.classList.add('active');
            document.getElementById('mode-pill-label').textContent = MODE_LABELS[mode] || mode;
            // Close dropdown
            document.getElementById('mode-dropdown').classList.remove('open');
            document.getElementById('mode-pill-btn').classList.remove('open');
            currentMode = mode;
            send({ type: 'set_mode', mode });
        }

        // ── Video sync ─────────────────────────────────────────
        function onYouTubeIframeAPIReady() {
            // Player initialized lazily when video mode is first activated
        }

        function initPlayer() {
            if (player) return;
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 1, controls: 1 },
            });
        }

        function syncPlayer(msg) {
            if (!player || !player.loadVideoById) { initPlayer(); return; }
            if (msg.video_id && msg.video_id !== currentVideoId) {
                player.loadVideoById(msg.video_id, msg.current_time || 0);
                currentVideoId = msg.video_id;
            }
            if (msg.state === 1 && player.playVideo) player.playVideo();
            if (msg.state === 2 && player.pauseVideo) player.pauseVideo();
            if (msg.current_time && player.seekTo && Math.abs((player.getCurrentTime?.() || 0) - msg.current_time) > 2) {
                player.seekTo(msg.current_time, true);
            }
        }

        // ── Karaoke sync ───────────────────────────────────────
        function syncKaraoke(msg) {
            const title = msg.video_title || '';
            if (title) {
                const q = encodeURIComponent(title + ' karaoke');
                document.getElementById('karaoke-frame').src =
                    'https://www.youtube.com/embed?listType=search&list=' + q + '&autoplay=1';
            }
        }

        // ── Init ───────────────────────────────────────────────
        loadInitialState();
        connectWS();
    {% endraw %}
    </script>
    <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
